# =================================================================================================
# sdk: build this SDK; release it when a version tag is pushed
# =================================================================================================
#
# Written by veilplane-server's SDK sync (from veilplane/workflows, sdk/templates/sdk.yml).
# Do not edit it here: the next sync overwrites it.
#
# - Every push to a version branch (v1, v2, ...) and every pull request: build the SDK.
# - A pushed tag v<version> (the sync tags every new version of the API): build, then publish to
#   the registry of this language, and create the GitHub release.
#
# All steps live in the reusable workflow sdk-release.yml of veilplane/workflows, shared by all
# SDK repositories; its header explains them. "secrets: inherit" passes this repository's
# registry secrets on to it (missing ones only skip their registry).
name: sdk

on:
  push:
    branches: ["v*"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance

jobs:
  sdk:
    uses: veilplane/workflows/.github/workflows/sdk-release.yml@main
    with:
      language: {{LANG}}
      publish: ${{ startsWith(github.ref, 'refs/tags/v') }}
    secrets: inherit
