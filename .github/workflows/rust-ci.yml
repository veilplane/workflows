# Checks a Rust workspace: formatting, clippy without warnings, tests.
name: rust-ci
on:
  workflow_call:
    inputs:
      features:
        description: Cargo feature options, e.g. "--all-features"
        type: string
        default: ""
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets ${{ inputs.features }} -- -D warnings
      - run: cargo test --workspace ${{ inputs.features }}
